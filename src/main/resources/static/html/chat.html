<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>스마트 상담</title>
    <style>
        :root {
            --blue: #3182F6;
            --blue-deep: #1B64DA;
            --blue-soft: #E8F1FF;
            --bg: #FFFFFF;
            --gray-bg: #F2F4F6;
            --line: #E5E8EB;
            --text: #191F28;
            --sub: #8B95A1;
            --shadow: 0 1px 3px rgba(0,0,0,0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body { height: 100%; }

        body {
            font-family: 'Toss Product Sans', 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, sans-serif;
            background: #D1D6DB;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text);
        }

        .app {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 900px;
            background: var(--gray-bg);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .header {
            background: var(--bg);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            border-bottom: 1px solid var(--line);
        }
        .header .avatar {
            width: 40px; height: 40px;
            border-radius: 12px;
            background: var(--blue);
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 17px;
            color: #FFFFFF;
            letter-spacing: -0.5px;
        }
        .header .info { flex: 1; line-height: 1.35; }
        .header .info .name { font-weight: 700; font-size: 17px; letter-spacing: -0.4px; }
        .header .info .status { font-size: 12.5px; color: var(--sub); display: flex; align-items: center; gap: 5px; }
        .header .info .status::before {
            content: ''; width: 6px; height: 6px; border-radius: 50%;
            background: #3182F6; display: inline-block;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .messages::-webkit-scrollbar { width: 0; }

        .day-divider {
            align-self: center;
            color: var(--sub);
            font-size: 12px;
            padding: 4px 12px;
            margin: 2px 0 8px;
        }

        .row { display: flex; gap: 8px; max-width: 82%; }
        .row.me { align-self: flex-end; flex-direction: row-reverse; }
        .row.bot { align-self: flex-start; }

        .bot-avatar {
            width: 30px; height: 30px; border-radius: 9px;
            background: var(--blue);
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 800; color: #FFFFFF;
            margin-top: 2px;
            letter-spacing: -0.5px;
        }

        .bubble {
            padding: 12px 15px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.55;
            letter-spacing: -0.3px;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .row.bot .bubble {
            background: var(--bg);
            color: var(--text);
            border-top-left-radius: 5px;
            box-shadow: var(--shadow);
        }
        .row.me .bubble {
            background: var(--blue);
            color: #FFFFFF;
            border-top-right-radius: 5px;
            font-weight: 500;
        }

        .typing { display: flex; gap: 4px; padding: 4px 2px; }
        .typing span {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--sub);
            animation: blink 1.3s infinite ease-in-out both;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink {
            0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1); }
        }

        .input-bar {
            flex-shrink: 0;
            background: var(--bg);
            border-top: 1px solid var(--line);
            padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
            display: flex;
            align-items: flex-end;
            gap: 8px;
        }
        .input-bar textarea {
            flex: 1;
            border: none;
            background: var(--gray-bg);
            border-radius: 22px;
            padding: 12px 16px;
            font-size: 15px;
            font-family: inherit;
            resize: none;
            max-height: 100px;
            line-height: 1.4;
            color: var(--text);
            outline: none;
            transition: box-shadow 0.15s;
        }
        .input-bar textarea:focus { box-shadow: 0 0 0 2px var(--blue-soft) inset; }
        .input-bar textarea::placeholder { color: var(--sub); }

        .send-btn {
            width: 44px; height: 44px;
            border-radius: 50%;
            border: none;
            background: var(--blue);
            color: #FFFFFF;
            cursor: pointer;
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.1s, background 0.15s;
        }
        .send-btn:active { transform: scale(0.92); background: var(--blue-deep); }
        .send-btn:disabled { background: var(--line); color: var(--sub); cursor: default; }

        .send-btn svg { width: 21px; height: 21px; }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <div class="avatar">AI</div>
        <div class="info">
            <div class="name">스마트 상담</div>
            <div class="status">응답 가능</div>
        </div>
    </div>

    <div class="messages" id="messages">
        <div class="day-divider">오늘</div>
        <div class="row bot">
            <div class="bot-avatar">AI</div>
            <div class="bubble">안녕하세요. 무엇을 도와드릴까요?</div>
        </div>
    </div>

    <div class="input-bar">
        <textarea id="input" rows="1" placeholder="메시지 입력" autocomplete="off"></textarea>
        <button class="send-btn" id="sendBtn" aria-label="전송">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="19" x2="12" y2="5"></line>
                <polyline points="5 12 12 5 19 12"></polyline>
            </svg>
        </button>
    </div>
</div>

<script>
    const API_BASE = '';
    const conversationId = 'web-' + Date.now();

    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    let streaming = false;

    inputEl.addEventListener('input', () => {
        inputEl.style.height = 'auto';
        inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px';
    });

    inputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            send();
        }
    });
    sendBtn.addEventListener('click', send);

    function scrollDown() {
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addMessage(text, who) {
        const row = document.createElement('div');
        row.className = 'row ' + who;
        if (who === 'bot') {
            const av = document.createElement('div');
            av.className = 'bot-avatar';
            av.textContent = 'AI';
            row.appendChild(av);
        }
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;
        row.appendChild(bubble);
        messagesEl.appendChild(row);
        scrollDown();
        return bubble;
    }

    function addTyping() {
        const row = document.createElement('div');
        row.className = 'row bot';
        row.id = 'typingRow';
        const av = document.createElement('div');
        av.className = 'bot-avatar';
        av.textContent = 'AI';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
        row.appendChild(av);
        row.appendChild(bubble);
        messagesEl.appendChild(row);
        scrollDown();
        return row;
    }

    function send() {
        if (streaming) return;
        const text = inputEl.value.trim();
        if (!text) return;

        addMessage(text, 'me');
        inputEl.value = '';
        inputEl.style.height = 'auto';

        streaming = true;
        sendBtn.disabled = true;

        const typingRow = addTyping();

        const url = API_BASE + '/chat/stream?message='
            + encodeURIComponent(text)
            + '&conversationId=' + encodeURIComponent(conversationId);

        const es = new EventSource(url);
        let botBubble = null;
        let answer = '';

        es.onmessage = (e) => {
            if (!botBubble) {
                typingRow.remove();
                botBubble = addMessage('', 'bot');
            }
            answer += e.data;
            botBubble.textContent = answer;
            scrollDown();
        };

        es.onerror = () => {
            es.close();
            streaming = false;
            sendBtn.disabled = false;
            if (!botBubble) {
                typingRow.remove();
                addMessage('일시적으로 응답을 받지 못했어요. 잠시 후 다시 시도해 주세요.', 'bot');
            }
            inputEl.focus();
        };
    }
</script>
</body>
</html>
