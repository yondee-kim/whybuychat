<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>스마트 상담</title>
    <style>
        :root {
            --blue: #3182F6;
            --blue-deep: #1B64DA;
            --blue-soft: #E8F1FF;
            --bg: #FFFFFF;
            --gray-bg: #F2F4F6;
            --line: #E5E8EB;
            --text: #191F28;
            --sub: #8B95A1;
            --shadow: 0 1px 3px rgba(0,0,0,0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; }

        body {
            font-family: 'Toss Product Sans', 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, sans-serif;
            background: #D1D6DB;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text);
        }

        .app {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 900px;
            background: var(--gray-bg);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* 화면 전환 */
        .screen { display: none; flex-direction: column; height: 100%; }
        .screen.active { display: flex; }

        /* ===== 헤더 공통 ===== */
        .header {
            background: var(--bg);
            padding: 16px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            border-bottom: 1px solid var(--line);
        }
        .header .icon-btn {
            width: 32px; height: 32px;
            border: none; background: none;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            color: var(--text);
            border-radius: 8px;
        }
        .header .icon-btn:active { background: var(--gray-bg); }
        .header .icon-btn svg { width: 22px; height: 22px; }
        .header .title { flex: 1; font-weight: 700; font-size: 18px; letter-spacing: -0.4px; }

        /* ===== 방 목록 화면 ===== */
        .room-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }
        .room-list::-webkit-scrollbar { width: 0; }

        .room {
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 14px 18px;
            cursor: pointer;
            transition: background 0.12s;
        }
        .room:active { background: var(--gray-bg); }
        .room .r-avatar {
            width: 46px; height: 46px;
            border-radius: 14px;
            background: var(--blue);
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-weight: 800; font-size: 15px;
            letter-spacing: -0.5px;
        }
        .room .r-info { flex: 1; min-width: 0; }
        .room .r-title {
            font-weight: 600; font-size: 15.5px; letter-spacing: -0.3px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .room .r-time { font-size: 12.5px; color: var(--sub); margin-top: 3px; }

        .room .r-delete {
            width: 34px; height: 34px;
            border: none;
            background: none;
            color: var(--sub);
            cursor: pointer;
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            border-radius: 8px;
            transition: background 0.12s, color 0.12s;
        }
        .room .r-delete:active { background: var(--gray-bg); color: #E5484D; }
        .room .r-delete svg { width: 19px; height: 19px; }

        .empty {
            text-align: center;
            color: var(--sub);
            font-size: 14px;
            padding: 60px 20px;
            line-height: 1.6;
        }

        .fab {
            position: absolute;
            bottom: 24px; right: 20px;
            width: 56px; height: 56px;
            border-radius: 50%;
            background: var(--blue);
            border: none;
            color: #fff;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 12px rgba(49,130,246,0.4);
            transition: transform 0.1s, background 0.15s;
        }
        .fab:active { transform: scale(0.92); background: var(--blue-deep); }
        .fab svg { width: 26px; height: 26px; }

        /* ===== 대화 화면 ===== */
        .chat-head-info { flex: 1; line-height: 1.3; }
        .chat-head-info .name { font-weight: 700; font-size: 16px; letter-spacing: -0.4px; }
        .chat-head-info .status { font-size: 12px; color: var(--sub); display: flex; align-items: center; gap: 5px; }
        .chat-head-info .status::before {
            content: ''; width: 6px; height: 6px; border-radius: 50%;
            background: var(--blue); display: inline-block;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 18px 16px 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .messages::-webkit-scrollbar { width: 0; }

        .row { display: flex; gap: 8px; max-width: 82%; }
        .row.me { align-self: flex-end; flex-direction: row-reverse; }
        .row.bot { align-self: flex-start; }

        .bot-avatar {
            width: 30px; height: 30px; border-radius: 9px;
            background: var(--blue);
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 800; color: #fff;
            margin-top: 2px; letter-spacing: -0.5px;
        }

        .bubble {
            padding: 12px 15px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.55;
            letter-spacing: -0.3px;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .row.bot .bubble {
            background: var(--bg);
            color: var(--text);
            border-top-left-radius: 5px;
            box-shadow: var(--shadow);
        }
        .row.me .bubble {
            background: var(--blue);
            color: #fff;
            border-top-right-radius: 5px;
            font-weight: 500;
        }

        .typing { display: flex; gap: 4px; padding: 4px 2px; }
        .typing span {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--sub);
            animation: blink 1.3s infinite ease-in-out both;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink {
            0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1); }
        }

        .input-bar {
            flex-shrink: 0;
            background: var(--bg);
            border-top: 1px solid var(--line);
            padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
            display: flex;
            align-items: flex-end;
            gap: 8px;
        }
        .input-bar textarea {
            flex: 1;
            border: none;
            background: var(--gray-bg);
            border-radius: 22px;
            padding: 12px 16px;
            font-size: 15px;
            font-family: inherit;
            resize: none;
            max-height: 100px;
            line-height: 1.4;
            color: var(--text);
            outline: none;
            transition: box-shadow 0.15s;
        }
        .input-bar textarea:focus { box-shadow: 0 0 0 2px var(--blue-soft) inset; }
        .input-bar textarea::placeholder { color: var(--sub); }

        .send-btn {
            width: 44px; height: 44px;
            border-radius: 50%;
            border: none;
            background: var(--blue);
            color: #fff;
            cursor: pointer;
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.1s, background 0.15s;
        }
        .send-btn:active { transform: scale(0.92); background: var(--blue-deep); }
        .send-btn:disabled { background: var(--line); color: var(--sub); cursor: default; }
        .send-btn svg { width: 21px; height: 21px; }

        /* ===== 모달 ===== */
        .modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.45);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            z-index: 10;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--bg);
            border-radius: 20px;
            padding: 24px 20px 20px;
            width: 100%;
            max-width: 320px;
        }
        .modal h3 {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.4px;
            margin-bottom: 16px;
        }
        .modal input {
            width: 100%;
            border: none;
            background: var(--gray-bg);
            border-radius: 12px;
            padding: 13px 15px;
            font-size: 15px;
            font-family: inherit;
            color: var(--text);
            outline: none;
            margin-bottom: 18px;
            transition: box-shadow 0.15s;
        }
        .modal input:focus { box-shadow: 0 0 0 2px var(--blue-soft) inset; }
        .modal-actions {
            display: flex;
            gap: 8px;
        }
        .modal-actions button {
            flex: 1;
            border: none;
            border-radius: 12px;
            padding: 13px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.15s;
        }
        .btn-cancel { background: var(--gray-bg); color: var(--sub); }
        .btn-cancel:active { background: var(--line); }
        .btn-confirm { background: var(--blue); color: #fff; }
        .btn-confirm:active { background: var(--blue-deep); }
    </style>
</head>
<body>
<div class="app">

    <!-- ===== 방 목록 화면 ===== -->
    <div class="screen active" id="listScreen">
        <div class="header">
            <div class="title">대화</div>
        </div>
        <div class="room-list" id="roomList"></div>
        <button class="fab" id="newRoomBtn" aria-label="새 대화">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        </button>
    </div>

    <!-- ===== 대화 화면 ===== -->
    <div class="screen" id="chatScreen">
        <div class="header">
            <button class="icon-btn" id="backBtn" aria-label="뒤로">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            <div class="bot-avatar">AI</div>
            <div class="chat-head-info">
                <div class="name" id="chatTitle">대화</div>
                <div class="status">응답 가능</div>
            </div>
        </div>
        <div class="messages" id="messages"></div>
        <div class="input-bar">
            <textarea id="input" rows="1" placeholder="메시지 입력" autocomplete="off"></textarea>
            <button class="send-btn" id="sendBtn" aria-label="전송">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="19" x2="12" y2="5"></line>
                    <polyline points="5 12 12 5 19 12"></polyline>
                </svg>
            </button>
        </div>
    </div>

    <!-- ===== 새 방 만들기 모달 ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h3>새 대화 시작</h3>
            <input type="text" id="roomNameInput" placeholder="대화 이름" maxlength="30" autocomplete="off">
            <div class="modal-actions">
                <button class="btn-cancel" id="modalCancel">취소</button>
                <button class="btn-confirm" id="modalConfirm">만들기</button>
            </div>
        </div>
    </div>

    <!-- ===== 삭제 확인 모달 ===== -->
    <div class="modal-overlay" id="deleteOverlay">
        <div class="modal">
            <h3>대화를 삭제할까요?</h3>
            <p id="deleteMsg" style="font-size:14px; color:var(--sub); line-height:1.5; margin-bottom:18px;"></p>
            <div class="modal-actions">
                <button class="btn-cancel" id="deleteCancel">취소</button>
                <button class="btn-confirm" id="deleteConfirm" style="background:#E5484D;">삭제</button>
            </div>
        </div>
    </div>
</div>

<script>
    const API = '';

    const listScreen = document.getElementById('listScreen');
    const chatScreen = document.getElementById('chatScreen');
    const roomListEl = document.getElementById('roomList');
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const chatTitleEl = document.getElementById('chatTitle');

    let currentRoomId = null;
    let streaming = false;

    // ===== 화면 전환 =====
    function showList() {
        chatScreen.classList.remove('active');
        listScreen.classList.add('active');
        loadRooms();
    }
    function showChat() {
        listScreen.classList.remove('active');
        chatScreen.classList.add('active');
    }

    // ===== 방 목록 불러오기 =====
    async function loadRooms() {
        try {
            const res = await fetch(API + '/conversations');
            const rooms = await res.json();
            renderRooms(rooms);
        } catch (e) {
            roomListEl.innerHTML = '<div class="empty">목록을 불러오지 못했어요.<br>잠시 후 다시 시도해 주세요.</div>';
        }
    }

    function renderRooms(rooms) {
        if (!rooms || rooms.length === 0) {
            roomListEl.innerHTML = '<div class="empty">아직 대화가 없어요.<br>아래 + 버튼으로 새 대화를 시작해 보세요.</div>';
            return;
        }
        roomListEl.innerHTML = '';
        rooms.forEach(r => {
            const div = document.createElement('div');
            div.className = 'room';
            div.innerHTML =
                '<div class="r-avatar">AI</div>' +
                '<div class="r-info">' +
                '<div class="r-title"></div>' +
                '<div class="r-time">' + formatTime(r.updatedAt) + '</div>' +
                '</div>' +
                '<button class="r-delete" aria-label="삭제">' +
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                '<polyline points="3 6 5 6 21 6"></polyline>' +
                '<path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>' +
                '</svg>' +
                '</button>';
            div.querySelector('.r-title').textContent = r.title;

            // 방 클릭 → 입장
            div.querySelector('.r-info').addEventListener('click', () => openRoom(r.id, r.title));
            div.querySelector('.r-avatar').addEventListener('click', () => openRoom(r.id, r.title));

            // 삭제 버튼 클릭 → 확인 모달 (입장 이벤트와 분리)
            div.querySelector('.r-delete').addEventListener('click', (e) => {
                e.stopPropagation();
                askDelete(r.id, r.title);
            });

            roomListEl.appendChild(div);
        });
    }

    function formatTime(iso) {
        if (!iso) return '';
        const d = new Date(iso);
        const now = new Date();
        const sameDay = d.toDateString() === now.toDateString();
        if (sameDay) {
            return d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
        }
        return (d.getMonth() + 1) + '월 ' + d.getDate() + '일';
    }

    // ===== 새 방 만들기 =====
    // ===== 새 방 만들기 모달 =====
    const modalOverlay = document.getElementById('modalOverlay');
    const roomNameInput = document.getElementById('roomNameInput');

    document.getElementById('newRoomBtn').addEventListener('click', () => {
        roomNameInput.value = '';
        modalOverlay.classList.add('active');
        roomNameInput.focus();
    });

    document.getElementById('modalCancel').addEventListener('click', () => {
        modalOverlay.classList.remove('active');
    });

    // 오버레이 바깥 클릭 시 닫기
    modalOverlay.addEventListener('click', (e) => {
        if (e.target === modalOverlay) modalOverlay.classList.remove('active');
    });

    // 입력창에서 Enter로 확정
    roomNameInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); createRoom(); }
    });

    document.getElementById('modalConfirm').addEventListener('click', createRoom);

    async function createRoom() {
        const title = roomNameInput.value.trim() || '새 대화';
        modalOverlay.classList.remove('active');
        try {
            const res = await fetch(API + '/conversations?title=' + encodeURIComponent(title), {
                method: 'POST'
            });
            const room = await res.json();
            openRoom(room.id, room.title);
        } catch (e) {
            alert('대화를 만들지 못했어요.');
        }
    }

    // ===== 방 삭제 =====
    const deleteOverlay = document.getElementById('deleteOverlay');
    const deleteMsg = document.getElementById('deleteMsg');
    let pendingDeleteId = null;

    function askDelete(id, title) {
        pendingDeleteId = id;
        deleteMsg.textContent = '"' + title + '" 대화 내용이 모두 삭제되며 되돌릴 수 없어요.';
        deleteOverlay.classList.add('active');
    }

    document.getElementById('deleteCancel').addEventListener('click', () => {
        deleteOverlay.classList.remove('active');
        pendingDeleteId = null;
    });

    deleteOverlay.addEventListener('click', (e) => {
        if (e.target === deleteOverlay) {
            deleteOverlay.classList.remove('active');
            pendingDeleteId = null;
        }
    });

    document.getElementById('deleteConfirm').addEventListener('click', async () => {
        if (!pendingDeleteId) return;
        const id = pendingDeleteId;
        deleteOverlay.classList.remove('active');
        pendingDeleteId = null;
        try {
            await fetch(API + '/conversations/' + encodeURIComponent(id), { method: 'DELETE' });
            loadRooms();  // 목록 새로고침
        } catch (e) {
            alert('삭제하지 못했어요.');
        }
    });

    // ===== 방 열기 (지난 대화 복원) =====
    async function openRoom(id, title) {
        currentRoomId = id;
        chatTitleEl.textContent = title;
        messagesEl.innerHTML = '';
        showChat();

        try {
            const res = await fetch(API + '/conversations/' + encodeURIComponent(id) + '/messages');
            const msgs = await res.json();
            if (msgs.length === 0) {
                addMessage('안녕하세요. 무엇을 도와드릴까요?', 'bot');
            } else {
                msgs.forEach(m => addMessage(m.content, m.role === 'user' ? 'me' : 'bot'));
            }
        } catch (e) {
            addMessage('이전 대화를 불러오지 못했어요.', 'bot');
        }
        inputEl.focus();
    }

    document.getElementById('backBtn').addEventListener('click', showList);

    // ===== 메시지 렌더링 =====
    function scrollDown() { messagesEl.scrollTop = messagesEl.scrollHeight; }

    function addMessage(text, who) {
        const row = document.createElement('div');
        row.className = 'row ' + who;
        if (who === 'bot') {
            const av = document.createElement('div');
            av.className = 'bot-avatar';
            av.textContent = 'AI';
            row.appendChild(av);
        }
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;
        row.appendChild(bubble);
        messagesEl.appendChild(row);
        scrollDown();
        return bubble;
    }

    function addTyping() {
        const row = document.createElement('div');
        row.className = 'row bot';
        const av = document.createElement('div');
        av.className = 'bot-avatar';
        av.textContent = 'AI';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
        row.appendChild(av);
        row.appendChild(bubble);
        messagesEl.appendChild(row);
        scrollDown();
        return row;
    }

    // ===== 전송 =====
    inputEl.addEventListener('input', () => {
        inputEl.style.height = 'auto';
        inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px';
    });
    inputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });
    sendBtn.addEventListener('click', send);

    function send() {
        if (streaming || !currentRoomId) return;
        const text = inputEl.value.trim();
        if (!text) return;

        addMessage(text, 'me');
        inputEl.value = '';
        inputEl.style.height = 'auto';

        streaming = true;
        sendBtn.disabled = true;
        const typingRow = addTyping();

        const url = API + '/chat/stream?message=' + encodeURIComponent(text)
            + '&conversationId=' + encodeURIComponent(currentRoomId);

        const es = new EventSource(url);
        let botBubble = null;
        let answer = '';

        es.onmessage = (e) => {
            if (!botBubble) {
                typingRow.remove();
                botBubble = addMessage('', 'bot');
            }
            answer += e.data;
            botBubble.textContent = answer;
            scrollDown();
        };

        es.onerror = () => {
            es.close();
            streaming = false;
            sendBtn.disabled = false;
            if (!botBubble) {
                typingRow.remove();
                addMessage('일시적으로 응답을 받지 못했어요. 잠시 후 다시 시도해 주세요.', 'bot');
            }
            inputEl.focus();
        };
    }

    // ===== 시작 =====
    loadRooms();
</script>
</body>
</html>
